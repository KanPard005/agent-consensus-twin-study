# Boolean task, finer mixed split (Kanad, 2026-11-18): 8 features,
# y = (x1 or x2 or x3 or x4) and (x5 or x6 or x7 or x8), flipped with probability 1 - rho.
# A sees x1, x2, x5, x6 and B sees x3, x4, x7, x8: 2 + 2 per clause each. A twin alone is sure
# of y = 1 only when it has a 1 in both of its clause halves. Because each half has two
# correlated features, that happens slightly more often than in the 6-feature split: some twin
# is sure on 45.9% of cases (43.0% there), y = 1 with neither sure on 4.3% (7.1%), and "say 1
# if either twin is sure" scores 0.866 (0.843). Own-features Bayes 0.752, all features 0.901.
# Copula and
# calibration as before: r_within = 0.5 inside a clause, P(clause = 1) = sqrt(0.5).
# Run size as the 6-feature mixed run: 400 study rows, 100 solo, 100 partner queries.
# Launch: scripts/launch_boolean.py --config configs/boolean_haiku_mixed8.yaml
#         --experiment boolean_haiku_mixed8 --pairs 10
experiment: boolean_haiku_mixed8
seed: 0
n_runs: 1

env:
  task: boolean
  clauses: [[0, 1, 2, 3], [4, 5, 6, 7]]
  views: {A: [0, 1, 4, 5], B: [2, 3, 6, 7]}
  r_within: 0.5
  r_cross: 0.0
  p_clause: 0.7071067811865476
  rho: 0.9

n_train: 400
K: 100
T: 100

agent:
  model: claude-haiku-5-5
  effort: low
  labels: {A: [x1, x2, x5, x6], B: [x3, x4, x7, x8]}
  page_size: 400
  cap: 40
  max_chars: 2000
  max_budget_usd: 3.0
  max_continues: 10
