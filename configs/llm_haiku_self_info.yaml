# Idea 1 (LogBook note 2026-11-09): what the self-learning twins (S1) are told about each other.
# A 2x2 over (feature names, tell_twin); the shared-names + told-twin cell is S1 itself
# (configs/llm_haiku_self.yaml), so only the other three cells are here. Same seed, streams and
# training samples as S1, so the arms are paired with S1 run by run.
#   S1n  : distinct feature names (A: a1..a3, B: b1..b3) + "your partner's features are different
#          variables", partner is told to be a twin (as S1)
#   S1u  : shared names x1..x3 (as S1), nothing said about what the partner is
#   S1nu : distinct names, nothing said about what the partner is
# Run once per rho with --set env.rho=<rho> experiment=llm_haiku_self_info_rho<rho>.
experiment: llm_haiku_self_info
seed: 0
n_runs: 3
summary_tail: 0.5
plot_window: 10

env:
  d_A: 3
  d_B: 3
  rho: 0.0
  norm_A: 1.0
  norm_B: 1.0
  sigma: 0.5

train:
  n_A: 200
  n_B: 200
  lam: 1.0

post:
  T: 60

protocols:
  - {name: no_talk, label: P0}
  - {name: blend, label: P1, prior_var: 1.0}
  - {name: exchange, label: P2, n_exchanges: 1, prior_scale: 1.0, msg_prior_var: 1.0}
  - &self
    name: llm_exchange
    label: S1n
    n_exchanges: 1
    tol: 0.01
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    learner: self
    train_batch: 25
    history_len: 10
    max_chars: 300
    notes_chars: 1200
    show_partner_estimates: true
    tell_twin: true
    feature_names: distinct
  - {<<: *self, label: S1u, tell_twin: false, feature_names: shared}
  - {<<: *self, label: S1nu, tell_twin: false, feature_names: distinct}
