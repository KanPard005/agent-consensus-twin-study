# As boolean_haiku_cnf3_blocks_c2noise.yaml but much noisier (Kanad, 2026-11-18): rho = 0.75, so
# even with all features the label is right only 75% of the time. All of the noise is still in
# clause 2 (eps = 0.397): y is exact when clause 1 or 3 is 0 and close to a coin flip (0.60)
# when clause 2 decides. Side effects: the flips mostly turn 1s into 0s, so P(y = 1) = 0.35
# (0.44 at rho = 0.9, 0.50 uniform); Bayes alone 0.646, about 'always say 0' (0.647); all 0.75.
#
# Block split with the label noise concentrated in the shared clause (Kanad, 2026-11-18): instead
# of flipping y w.p. 0.1, clause 2 (x3 or x4, split between the twins) is flipped w.p. eps = 0.159,
# so P(y = pi) is still 0.9 overall but y = pi exactly whenever clause 1 or 3 is 0: a fully seen
# zero clause, the twin's own or the partner's, is never wrong. Same features as the block run.
# Bayes: 0.729 alone, 0.900 together. Prompts unchanged.
#
# Boolean task with three clauses (Kanad, 2026-11-18): y = (x1 or x2) and (x3 or x4) and (x5 or x6),
# flipped with probability 1 - rho. p_clause = 0.5^(1/3) so that P(pi = 1) = 0.5. Copula as before
# (r_within = 0.5 inside a clause). Block split: A sees x1, x2, x3 (clause 1 and half of clause 2), B sees x4, x5, x6. A twin can be sure of y = 0 (a fully seen clause is 0), never of y = 1. Bayes: 0.74 alone, 0.90 together.
# 400 study rows, 100 solo and 100 partner queries. Pilot: one pair (or one single agent).
experiment: boolean_haiku_cnf3_blocks_c2noise_rho75
seed: 0
n_runs: 1

env:
  task: boolean
  clauses: [[0, 1], [2, 3], [4, 5]]
  views: {A: [0, 1, 2], B: [3, 4, 5]}
  r_within: 0.5
  r_cross: 0.0
  p_clause: 0.7937005259840998
  rho: 0.75
  noise_clause: 1      # all label noise in clause 2 (x3 or x4), eps = 0.397

n_train: 400
K: 100
T: 100

agent:
  model: claude-haiku-5-5
  effort: low
  labels: {A: [x1, x2, x3], B: [x4, x5, x6]}
  page_size: 400
  cap: 40
  max_chars: 2000
  max_budget_usd: 3.0
  max_continues: 10
