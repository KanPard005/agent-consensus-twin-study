# d = 20 version of configs/llm_haiku_sessions_samey2.yaml (LogBook 2026-11-13): individual scoring,
# the same-y sentence, regress + model instances from the training phase on. Equal pairs,
# lambda in {0, 0.5}, both twins study n in {50, 200, 800} cases (train n = 1600, nested). Question: do the twins use the tools, how does that
# change with n, and how much do they weigh the partner when they don't?
experiment: llm_haiku_sessions_samey2_d20
seed: 0
n_runs: 1
T: 30

env:
  d_A: 20
  d_B: 20
  cov: controlled
  lambda_xz: 0.0
  rotate: true
  align: 1.0
  normalize: false
  sigma: 0.5

train:
  n_A: 1600
  n_B: 1600
  lam: 1.0

agent:
  model: claude-haiku-5-5
  effort: low
  labels: {A: [a1, a2, a3, a4, a5, a6, a7, a8, a9, a10, a11, a12, a13, a14, a15, a16, a17, a18, a19, a20], B: [b1, b2, b3, b4, b5, b6, b7, b8, b9, b10, b11, b12, b13, b14, b15, b16, b17, b18, b19, b20]}
  budget: 50
  study_all: true
  team_rule: individual     # each twin scored on its own final (no team average)
  tol: 0.01
  max_attempts: 3
  penalty: 10.0
  max_chars: 2000
  cap: 40                   # tool calls per query (the model tools need more)
  structure_hint: false
  partner_info: true
  same_y: true
  model_tools: true
  models_in_training: true  # instances from the training phase on, with expression columns
  max_budget_usd: 6.0
  max_continues: 10
