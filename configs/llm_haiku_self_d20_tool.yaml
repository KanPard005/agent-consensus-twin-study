# S1n at d = 20 with a regression tool in the learning phase (S1nt). Without it (S1n,
# configs/llm_haiku_self_d20.yaml) half the twins learned only a constant from raw rows. Here each
# twin can fit y on any of its features by least squares over all training cases shown so far, at
# most 3 calls per batch, and writes its notes from that; the communication phase has no tool,
# so predictions are still computed by hand from the notes. Same seed / streams / training data
# as the S1n d = 20 runs, so S1nt is paired with them run by run.
# Run once per rho with --set env.rho=<rho> experiment=llm_haiku_self_d20_tool_rho<rho>.
experiment: llm_haiku_self_d20_tool
seed: 0
n_runs: 3
summary_tail: 0.5
plot_window: 10

env:
  d_A: 20
  d_B: 20
  rho: 0.0
  norm_A: 1.0
  norm_B: 1.0
  sigma: 0.5

train:
  n_A: 200
  n_B: 200
  lam: 1.0

post:
  T: 60

protocols:
  - {name: no_talk, label: P0}
  - {name: blend, label: P1, prior_var: 1.0}
  - {name: exchange, label: P2, n_exchanges: 1, prior_scale: 1.0, msg_prior_var: 1.0}
  - name: llm_exchange
    label: S1nt
    n_exchanges: 1
    tol: 0.01
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    learner: self
    train_batch: 25
    history_len: 10
    max_chars: 300
    notes_chars: 1200
    show_partner_estimates: true
    tell_twin: true
    feature_names: distinct
    train_tool: true
    train_tool_calls: 3
