# Mediated self-learning twins (LogBook 2026-11-10): the twins only predict and a third Haiku,
# the mediator, decides (`consensus.mediator`).
#   S1n : self-learning twins with distinct feature names, 2 rounds of talk, team = average
#         (as configs/llm_haiku_self_info.yaml; rerun here so the arms are paired on this machine)
#   M1  : the same twins (same learning phase settings), one estimate each per step, no messages;
#         the mediator sees each twin's features, notes and estimate and makes the prediction
# Same seed, streams and training samples as S1 / S1n, so the arms are paired run by run.
# Run once per rho with --set env.rho=<rho> experiment=llm_haiku_mediated_rho<rho>.
experiment: llm_haiku_mediated
seed: 0
n_runs: 3
summary_tail: 0.5
plot_window: 10

env:
  d_A: 3
  d_B: 3
  rho: 0.0
  norm_A: 1.0
  norm_B: 1.0
  sigma: 0.5

train:
  n_A: 200
  n_B: 200
  lam: 1.0

post:
  T: 60

protocols:
  - {name: no_talk, label: P0}
  - {name: blend, label: P1, prior_var: 1.0}
  - {name: exchange, label: P2, n_exchanges: 1, prior_scale: 1.0, msg_prior_var: 1.0}
  - &self
    name: llm_exchange
    label: S1n
    n_exchanges: 1
    tol: 0.01
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    learner: self
    train_batch: 25
    history_len: 10
    max_chars: 300
    notes_chars: 1200
    show_partner_estimates: true
    tell_twin: true
    feature_names: distinct
  - name: llm_mediated
    label: M1
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    learner: self
    train_batch: 25
    history_len: 10
    notes_chars: 1200
    tell_twin: true
    feature_names: distinct
    mediator_notes_chars: 1200
    mediator_history_len: 10
