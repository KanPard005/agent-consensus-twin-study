# Single-agent baseline for the boolean task (Kanad, 2026-11-18): one Haiku agent sees all six
# features and goes through the same three phases alone: the same 40 study cases as pair r, the
# same 20 solo cases, then the same 40 cases the pairs answered together (queries 21-60, announced
# after query 20 with no partner). Everything else as configs/boolean_haiku.yaml.
# Bayes references: with all features, accuracy 0.90 (rho).
# Launch: scripts/launch_boolean.py --config configs/boolean_haiku_single.yaml
#         --experiment boolean_haiku_single --pairs 10
experiment: boolean_haiku_single
seed: 0
n_runs: 1
single: true

env:
  task: boolean
  clauses: [[0, 1, 2], [3, 4, 5]]
  views: {A: [0, 1, 2, 3, 4, 5], B: [0, 1, 2, 3, 4, 5]}
  r_within: 0.5
  r_cross: 0.0
  p_clause: 0.7071067811865476
  rho: 0.9

n_train: 40
K: 20
T: 40

agent:
  model: claude-haiku-5-5
  effort: low
  labels: {A: [x1, x2, x3, x4, x5, x6]}
  page_size: 40
  cap: 40
  max_chars: 2000
  max_budget_usd: 3.0
  max_continues: 10
