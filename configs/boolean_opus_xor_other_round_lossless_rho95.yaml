# rho = 0.95 (Kanad, 2026-11-20): as boolean_opus_xor_other_round_lossless, with labels flipped
# w.p. 0.05 instead of 0.1. Same features per case; only the label flips differ.
# Opus 5.5 version (Kanad, 2026-11-20) of configs/boolean_haiku_xor_other_round_lossless.yaml: one
# pair (pair 0), same cases.
# Lossless channel (Kanad, 2026-11-20): as boolean_haiku_xor_other_round_notify, and a message sent after the query is
# resolved (or after the other twin ended the round) is delivered with a notification
# instead of rejected. Same cases.
# Message notifications (Kanad, 2026-11-19): as boolean_haiku_xor_other_round (minimal 'other agent' framing with the opening round), but every tool result says
# when there are unread messages from the other twin, and messages sent after the reader
# moved on are kept (shown with the query they were sent in). Same cases.
# Minimal framing with an opening round (Kanad, 2026-11-19): as boolean_haiku_xor_other, plus one
# free communication round before the queries "to gather information and to establish how you will
# communicate". Same cases as boolean_haiku_xor.
# XOR task (Kanad, 2026-11-19): 10 Haiku pairs.
# y = (x1 or x2 or x3) xor (x4 or x5 or x6), flipped w.p. 0.1. Clean split: A sees one clause, B the
# other. p_clause = 0.5 and r_cross = 0 (r_within = 0.5), so each twin's own features leave
# P(y = 1) at exactly 0.5: Bayes is 0.50 alone and 0.90 together. Averaging probabilities gains
# nothing; only exchanging the clause values (one bit each) helps. Neutral names: A sees
# a1, a2, a3 = x1, x2, x3; B sees b1, b2, b3 = x6, x4, x5 (B's columns shuffled).
# 400 study rows, 100 solo and 100 partner queries.
experiment: boolean_opus_xor_other_round_lossless_rho95
seed: 0
n_runs: 1

env:
  task: boolean
  label: xor
  clauses: [[0, 1, 2], [3, 4, 5]]
  views: {A: [0, 1, 2], B: [5, 3, 4]}
  r_within: 0.5
  r_cross: 0.0
  p_clause: 0.5
  rho: 0.95

other_agent: true
briefing: true

notify_messages: true
late_messages: true

n_train: 400
K: 100
T: 100

agent:
  model: claude-opus-5-5
  effort: low
  labels: {A: [a1, a2, a3], B: [b1, b2, b3]}
  page_size: 400
  cap: 40
  max_chars: 2000
  max_budget_usd: 20.0
  max_continues: 10
