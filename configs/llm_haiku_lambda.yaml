# Controlled design (LogBook note 2026-11-11, "More controlled experiment on differences"):
# does the entrenchment of self-learning LLM twins follow the disagreement of their solo opinions?
#
# Sigma = [[I, lambda U V^T], [lambda V U^T, I]] with random orthogonal U, V (fixed by `seed`, so
# the same for every lambda), w_A = U 1/sqrt(3), w_B = V 1/sqrt(3). The population solo opinions
# disagree by 2 (1 - lambda^2)(1 + lambda) (peak 2.37 at lambda = 1/3, 2.00 at 0, 0.72 at 0.9);
# relative to the signal variance 2 (1 + lambda) that is 1 - lambda^2, which is also the
# squared distance from a twin's solo opinion to its best response to the partner's.
#
# S1n twins (distinct feature names, told they are twins) study the first 25 or 400 of the same
# 400 training cases (nested, paired), then talk for T = 30 steps with the averaging rule and an
# 80% interval on every estimate (as configs/llm_haiku_entrench.yaml).
# One arm and replicate per process:
#   --set env.lambda_xz=0.333 only=[E25] first_run=0 n_runs=1
#         experiment=llm_haiku_lambda_lam0.333_E25_r0
experiment: llm_haiku_lambda
seed: 0
n_runs: 4
summary_tail: 1.0
plot_window: 5

env:
  d_A: 3
  d_B: 3
  cov: controlled
  lambda_xz: 0.0
  rotate: true
  align: 1.0
  normalize: false
  sigma: 0.5

train:
  n_A: 400
  n_B: 400
  lam: 1.0

post:
  T: 30

protocols:
  - {name: no_talk, label: P0}
  - &self
    name: llm_exchange
    label: E25
    n_exchanges: 1
    tol: 0.01
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    learner: self
    train_batch: 25
    history_len: 10
    max_chars: 300
    notes_chars: 1200
    show_partner_estimates: true
    tell_twin: true
    feature_names: distinct
    ask_interval: true
    self_n_A: 25
    self_n_B: 25
  - {<<: *self, label: E400, self_n_A: 400, self_n_B: 400}
