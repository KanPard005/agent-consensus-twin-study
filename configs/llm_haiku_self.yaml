# Self-learning LLM twins (S1): no linear model. Each Haiku twin is shown its own 200 training
# cases (the same samples the linear twins train on) in batches of 25 and writes its own
# model/rules in its notes; it then predicts from features + notes, talks for 2 rounds per step,
# and sees the revealed y (online feedback) as in P8. No tools.
experiment: llm_haiku_self
seed: 0
n_runs: 3
summary_tail: 0.5
plot_window: 10

env:
  d_A: 3
  d_B: 3
  rho: 0.5
  norm_A: 1.0
  norm_B: 1.0
  sigma: 0.5

train:
  n_A: 200
  n_B: 200
  lam: 1.0

post:
  T: 60

protocols:
  - {name: no_talk, label: P0}
  - {name: blend, label: P1, prior_var: 1.0}
  - {name: exchange, label: P2, n_exchanges: 1, prior_scale: 1.0, msg_prior_var: 1.0}
  - {name: exchange, label: P3, n_exchanges: 3, prior_scale: 1.0, msg_prior_var: 1.0, tol: 0.01}
  - name: llm_exchange
    label: S1
    n_exchanges: 1
    tol: 0.01
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    learner: self
    train_batch: 25
    history_len: 10
    max_chars: 300
    notes_chars: 1200
    tell_twin: true
    show_partner_estimates: true
