# Hidden-profile task, facts-first condition (HF): as H1 in hp_haiku.yaml, but round 1 is
# facts only (no probabilities, no stated favourite), so neither twin commits to or hears a
# first read before the partner's facts arrive. Same seed and generator as hp_haiku, so the
# cases are the same as H1's and F1's (paired comparison). Run once per p_shared with
#   --set cases.p_shared=<p> experiment=hp_haiku_ff_p<p>
experiment: hp_haiku_ff
seed: 0
n_runs: 3

cases:
  n_sites: 3
  clues_per_site: 6
  p_shared: 0.5
  min_margin: 2.0
  n_hidden: 15
  n_control: 5

protocols:
  - name: hp_talk
    label: HF
    n_exchanges: 2
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    max_chars: 600
    notes_chars: 800
    history_len: 10
    tell_split: true
    tell_twin: true
    facts_first: true
