# Self-learning twins with 20 features each (S1n setup at d = 20): distinct feature names
# (A: a1..a20, B: b1..b20, and the system prompt says the partner's are different variables),
# told they are twins. Otherwise as configs/llm_haiku_self_info.yaml (200 training cases in
# batches of 25, T = 60, 2 rounds, 300-character messages, 1200-character notes).
# At d = 20 the signal is spread over many features (seed 0: the top 3 of A's 20 weights carry
# 57% of |w_A|^2, vs one weight of 0.96 at d = 3), so a twin can no longer predict well from one
# feature, and its partner's features carry more than its single prediction.
# Run once per rho with --set env.rho=<rho> experiment=llm_haiku_self_d20_rho<rho>.
experiment: llm_haiku_self_d20
seed: 0
n_runs: 3
summary_tail: 0.5
plot_window: 10

env:
  d_A: 20
  d_B: 20
  rho: 0.0
  norm_A: 1.0
  norm_B: 1.0
  sigma: 0.5

train:
  n_A: 200
  n_B: 200
  lam: 1.0

post:
  T: 60

protocols:
  - {name: no_talk, label: P0}
  - {name: blend, label: P1, prior_var: 1.0}
  - {name: exchange, label: P2, n_exchanges: 1, prior_scale: 1.0, msg_prior_var: 1.0}
  - name: llm_exchange
    label: S1n
    n_exchanges: 1
    tol: 0.01
    backend: {kind: cli, model: claude-haiku-5-5, effort: low}
    learner: self
    train_batch: 25
    history_len: 10
    max_chars: 300
    notes_chars: 1200
    show_partner_estimates: true
    tell_twin: true
    feature_names: distinct
