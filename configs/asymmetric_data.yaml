# A trained on little data, B on a lot: who moves after communication?
experiment: asymmetric_data
seed: 0
n_runs: 20

env:
  d_A: 3
  d_B: 3
  rho: 0.5        # corr(x^A_j, x^B_j); the blend gap needs rho != 0 and d >= 2
  norm_A: 1.0     # ||w^A|| (random direction from `seed`); or give w_A: [...] explicitly
  norm_B: 1.0
  sigma: 0.5      # label noise std

train:            # training phase: each twin on its own iid stream
  n_A: 30
  n_B: 2000
  lam: 1.0

post:             # post-training (communication) phase, y_t revealed online
  T: 3000

protocols:
  - {name: no_talk, label: P0}
  - {name: blend, label: P1, prior_var: 1.0}
  - {name: exchange, label: P2, n_exchanges: 1, prior_scale: 1.0, msg_prior_var: 1.0}
  - {name: exchange, label: P3, n_exchanges: 3, prior_scale: 1.0, msg_prior_var: 1.0, tol: 0.01}
