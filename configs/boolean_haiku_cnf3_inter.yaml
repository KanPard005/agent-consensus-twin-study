# Boolean task with three clauses (Kanad, 2026-11-18): y = (x1 or x2) and (x3 or x4) and (x5 or x6),
# flipped with probability 1 - rho. p_clause = 0.5^(1/3) so that P(pi = 1) = 0.5. Copula as before
# (r_within = 0.5 inside a clause). Interleaved split: A sees x1, x3, x5 and B sees x2, x4, x6 (one feature of each clause). A twin is sure of y = 1 only when all three of its features are 1, never of y = 0. Bayes: 0.707 alone, 0.90 together; 'say 1 if either twin is sure' 0.826.
# 400 study rows, 100 solo and 100 partner queries. Pilot: one pair (or one single agent).
experiment: boolean_haiku_cnf3_inter
seed: 0
n_runs: 1

env:
  task: boolean
  clauses: [[0, 1], [2, 3], [4, 5]]
  views: {A: [0, 2, 4], B: [1, 3, 5]}
  r_within: 0.5
  r_cross: 0.0
  p_clause: 0.7937005259840998
  rho: 0.9

n_train: 400
K: 100
T: 100

agent:
  model: claude-haiku-5-5
  effort: low
  labels: {A: [x1, x3, x5], B: [x2, x4, x6]}
  page_size: 400
  cap: 40
  max_chars: 2000
  max_budget_usd: 3.0
  max_continues: 10
