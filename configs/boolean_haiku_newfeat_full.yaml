# Control for configs/boolean_haiku_newfeat.yaml (Kanad, 2026-11-19): the same four-clause AND and
# the same cases, but each twin sees all four of its features from the start, in the study rows
# too (A: a1..a4; B: b1..b4). No new features and no announcement; prompts are the standard ones.
# Shows how twins use their second clause when it is studied, and the partner's zeros without
# competition from unstudied columns. 400 study rows, 100 solo and 100 partner queries.
# Bayes accuracy: own features 0.734, all eight 0.901.
experiment: boolean_haiku_newfeat_full
seed: 0
n_runs: 1

env:
  task: boolean
  clauses: [[0, 1], [2, 3], [4, 5], [6, 7]]
  views: {A: [0, 1, 2, 3], B: [4, 5, 6, 7]}
  r_within: 0.5
  r_cross: 0.0
  p_pi: 0.5
  rho: 0.9

n_train: 400
K: 100
T: 100

agent:
  model: claude-haiku-5-5
  effort: low
  labels: {A: [a1, a2, a3, a4], B: [b1, b2, b3, b4]}
  page_size: 400
  cap: 40
  max_chars: 2000
  max_budget_usd: 3.0
  max_continues: 10
