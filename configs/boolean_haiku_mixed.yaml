# Boolean task, mixed split (Kanad, 2026-11-18; note variation 1, "division of features"):
# y = (x1 or x2 or x3) and (x4 or x5 or x6) as before, but each twin sees features from both
# clauses: A sees x1, x2, x4 and B sees x3, x5, x6 (2 of one clause and 1 of the other, mirrored).
# A twin alone can be sure only that a clause is 1, never that it is 0, so it can be sure of
# y = 1 (up to noise) but never of y = 0. The best message is two bits each: the OR of its
# features in each clause. Run size as in the last clean-split run: 400 study rows, 100 solo and
# 100 partner queries. Everything else as configs/boolean_haiku.yaml.
# Launch: scripts/launch_boolean.py --config configs/boolean_haiku_mixed.yaml
#         --experiment boolean_haiku_mixed --pairs 10
experiment: boolean_haiku_mixed
seed: 0
n_runs: 1

env:
  task: boolean
  clauses: [[0, 1, 2], [3, 4, 5]]
  views: {A: [0, 1, 3], B: [2, 4, 5]}
  r_within: 0.5
  r_cross: 0.0
  p_clause: 0.7071067811865476
  rho: 0.9

n_train: 400
K: 100
T: 100

agent:
  model: claude-haiku-5-5
  effort: low
  labels: {A: [x1, x2, x4], B: [x3, x5, x6]}
  page_size: 400
  cap: 40
  max_chars: 2000
  max_budget_usd: 3.0
  max_continues: 10
